name: nippo-local

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    command: npm run dev -w @nippo-local/api
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /workspace/data
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    command: npm run dev -w @nippo-local/web -- --host 0.0.0.0
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  node_modules:

